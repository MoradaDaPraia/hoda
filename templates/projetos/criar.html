{% extends 'base.html' %}

{% block body %}
<div class="container">
    <h2>Criar Projeto</h2>
    <form method="post">
        <div class="mb-3">
            <label>Nome</label>
            <input name="nome" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Codinome</label>
            <input name="codinome" class="form-control" />
        </div>
        <div class="mb-3">
            <label>Descrição</label>
            <textarea name="descricao" class="form-control"></textarea>
        </div>
        <button class="btn btn-primary">Criar</button>
    </form>
</div>
{% endblock %}
